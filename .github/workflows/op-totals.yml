name: Aggiorna conteggi set One Piece

# Sonda una volta sola, lato server, quante carte esistono davvero per ogni
# espansione One Piece e salva il risultato nel repository. Cosi' il numero
# "carte trovate" e' sempre corretto per tutti, anche per un set mai aperto.
on:
  schedule:
    - cron: "10 5 * * *"   # ogni giorno alle 05:10 UTC
  workflow_dispatch: {}      # pulsante manuale in Actions > Run workflow

permissions:
  contents: write

jobs:
  totals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sonda i set e genera i conteggi
        run: python scripts/build-op-totals.py

      - name: Commit se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add op-set-totals.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica ai conteggi."
          else
            git commit -m "Aggiorna conteggi set One Piece (automatico)"
            git push
          fi
