<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collezionista Matto · One Piece / Yu-Gi-Oh! / Lorcana / Magic / LEGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --sea:#15161A; --panel:#1F2126; --line:#34363D;
    --parchment:#F1F0ED; --gold:#C74634; --wax:#DE5B46; --mute:#96999F;
    --panel2:#262830; --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  [hidden]{display:none !important;}
  body{background:var(--sea); color:var(--parchment); font-family:"IBM Plex Sans",system-ui,sans-serif;}

  #errBar{
    position:fixed; left:0; right:0; bottom:0; z-index:100;
    background:#3A1512; color:#F1F0ED; font-size:13px; line-height:1.4;
    padding:10px 14px; display:flex; gap:12px; align-items:flex-start;
    border-top:2px solid var(--wax); box-shadow:0 -4px 20px rgba(0,0,0,.4);
  }
  #errBar[hidden]{display:none;}
  #errText{flex:1; word-break:break-word; font-family:ui-monospace,monospace;}
  #errClose{
    background:#F1F0ED; color:#3A1512; border:none; border-radius:var(--radius-sm);
    padding:5px 10px; font:inherit; font-weight:600; cursor:pointer; flex:0 0 auto;
  }

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, #15161A 75%, rgba(21,22,26,.92));
    border-bottom:1px solid var(--line);
    padding:14px 18px 10px;
    display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center;
  }
  #logoMark{flex:0 0 auto; display:flex;}
  #logoMark svg{width:34px; height:34px; display:block;}
  h1{
    font-family:"Fredoka","IBM Plex Sans",system-ui,sans-serif; font-weight:700;
    font-size:clamp(20px,4.2vw,33px); color:var(--gold);
    cursor:pointer; white-space:nowrap;
  }
  h1:hover{text-shadow:0 0 14px rgba(199,70,52,.4);}
  .hbtn{
    background:var(--panel); color:var(--parchment); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; font:inherit; font-size:13px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .hbtn:hover{border-color:var(--gold); background:var(--panel2);}
  .hbtn-accent{background:var(--gold); border-color:var(--gold); color:#fff; font-weight:600;}
  .hbtn-accent:hover{background:var(--wax); border-color:var(--wax); color:#fff;}

  /* Home: hero della landing */
  #homeHero{max-width:500px; margin:34px auto 0; text-align:center;}
  #homeHero h2{
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:800; letter-spacing:-.02em;
    font-size:clamp(30px,6vw,46px); color:var(--gold); line-height:1.1;
  }
  #homeHero p{color:var(--mute); font-size:14px; margin-top:8px;}

  /* Home: scelta della collezione */
  #home{
    display:grid; gap:22px; grid-template-columns:repeat(3, 1fr);
    max-width:1200px; margin:34px auto 0; padding:0 16px;
  }
  @media (max-width:640px){ #home{ grid-template-columns:1fr; max-width:520px; } }
  .gamecard{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    overflow:hidden; cursor:pointer; transition:transform .15s, border-color .15s, box-shadow .15s;
  }
  .gamecard:hover{transform:translateY(-4px); border-color:var(--gold); box-shadow:0 12px 28px rgba(0,0,0,.35);}
  .gamecard img{
    display:block; width:100%; aspect-ratio:16/9; object-fit:cover; object-position:center;
    background:linear-gradient(135deg, #262830, #1B1C21);
  }
  .gamecard .gtitle{
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:800; letter-spacing:-.01em; font-size:22px; color:var(--gold);
    padding:12px 14px 2px;
  }
  .gamecard .gsub{color:var(--mute); font-size:12px; padding:0 14px 14px;}
  #homeIntro{max-width:500px; margin:22px auto 0; color:var(--mute); font-size:14px;}

  /* Griglia delle espansioni con copertina */
  .backBtn{
    background:var(--panel); color:var(--parchment); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; font:inherit; font-size:13px; cursor:pointer;
    margin-bottom:12px; transition:border-color .15s, background .15s;
  }
  .backBtn:hover{border-color:var(--gold); background:var(--panel2);}

  .langBar{display:flex; align-items:center; gap:8px; margin:0 0 12px; flex-wrap:wrap;}
  .langLbl{color:var(--mute); font-size:13px;}
  .langBar button{
    background:var(--panel); color:var(--parchment); border:1px solid var(--line);
    border-radius:999px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .langBar button.active{background:var(--gold); color:#fff; border-color:var(--gold); font-weight:600;}
  .langBar button:hover{border-color:var(--gold);}
  .langBar button{display:inline-flex; align-items:center; gap:7px;}
  .flag{width:20px; height:13px; border-radius:2px; flex:0 0 auto; display:block;}
  .langTag{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px; margin-left:6px;
    background:var(--panel2); border:1px solid var(--line); color:var(--parchment); vertical-align:middle;
  }
  #setsTitle{
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:700; letter-spacing:-.01em;
    font-size:clamp(22px,3vw,30px); margin:4px 0 12px;
  }
  #setsGrid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));}
  .settile{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
    overflow:hidden; cursor:pointer; text-align:center; transition:transform .12s, border-color .12s, box-shadow .12s;
    position:relative;
  }
  .settileBadge{
    position:absolute; top:8px; left:8px; z-index:1;
    background:var(--gold); color:#fff; font-size:10px; font-weight:600;
    padding:3px 9px; border-radius:999px;
  }
  .settileSpacer{display:block; height:14px;}
  .settile:hover{transform:translateY(-3px); border-color:var(--gold); box-shadow:0 10px 24px rgba(0,0,0,.3);}
  .settile img{
    display:block; width:100%; aspect-ratio:600/700; object-fit:cover; object-position:center 12%;
    background:#1B1C21;
  }
  .settile .scode{
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:700; font-size:17px; letter-spacing:0;
    color:var(--gold); padding-top:7px;
  }
  .settile .sname{
    font-size:11px; color:var(--mute); padding:0 8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .settile .sbar{
    height:6px; margin:7px 10px 10px; background:var(--sea);
    border:1px solid var(--line); border-radius:999px; overflow:hidden;
  }
  .settile .sbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--wax));}
  .settile .sprog{font-size:10px; color:var(--mute); padding-bottom:8px; margin-top:-6px; display:block;}
  #ygoPicker{display:none; padding:4px 0 12px;}
  #ygoPicker input{
    width:min(420px,100%); background:var(--panel); border:1px solid var(--line);
    color:var(--parchment); border-radius:999px; padding:9px 16px; font:inherit;
  }
  #ygoPicker input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .settile.ygo img{aspect-ratio:1/1; object-fit:contain; padding:8px; background:#1B1C21;}
  .settile.mtg img{aspect-ratio:1/1; object-fit:contain; padding:22px; background:#1B1C21;}

  main{padding:16px 18px 60px; max-width:1400px; margin:0 auto;}
  #setTitle{
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:700; letter-spacing:-.01em;
    font-size:clamp(20px,3vw,28px); margin:6px 0 2px;
  }
  #setCount{color:var(--mute); font-size:13px; margin-bottom:14px;}

  #grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(138px, 1fr));}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
    overflow:hidden; cursor:zoom-in; transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-3px); border-color:var(--gold); box-shadow:0 8px 20px rgba(0,0,0,.3);}
  .card img{display:block; width:100%; aspect-ratio:600/838; object-fit:cover; background:#1B1C21;}
  .card.ygo img{aspect-ratio:421/614;}
  .card.lego img{aspect-ratio:4/3; object-fit:contain; background:#fff; padding:6px;}
  .card figcaption{
    font-size:11px; letter-spacing:.3px; color:var(--mute);
    text-align:center; padding:5px 4px 0;
  }
  .card.hit{outline:3px solid var(--wax); outline-offset:2px;}

  /* Possesso e quantita' */
  .card .owncap{display:flex; flex-direction:column; align-items:center; gap:3px; padding-bottom:6px;}
  .card .clabel{max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px;}
  .stepper{display:flex; align-items:center; gap:2px;}
  .stepper button{
    width:26px; height:26px; border:1px solid var(--line); background:var(--sea);
    color:var(--parchment); border-radius:999px; font-size:15px; line-height:1; cursor:pointer; transition:border-color .15s;
  }
  .stepper button:hover{border-color:var(--gold);}
  .stepper .qty{min-width:26px; text-align:center; font-size:13px; font-weight:600; color:var(--mute);}
  .card.owned .stepper .qty{color:var(--gold);}
  .card.owned{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .card.owned figcaption{color:var(--gold);}
  .card:not(.owned) img{filter:grayscale(.55) brightness(.75);}
  body.filter-owned .card:not(.owned){display:none;}
  body.filter-missing .card.owned{display:none;}
  body.filter-dupes .card:not(.dupe){display:none;}

  #toolbar{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px;}
  #toolbar button, #overview button, #ovActions button{
    background:var(--panel); color:var(--parchment); border:1px solid var(--line);
    border-radius:999px; padding:8px 15px; font:inherit; font-size:13px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  #toolbar button.active{background:var(--gold); color:#fff; border-color:var(--gold); font-weight:600;}
  #toolbar button:hover, #overview button:hover{border-color:var(--gold); background:var(--panel2);}
  #searchWrap{margin-left:auto;}
  #search{
    background:var(--panel); border:1px solid var(--line);
    color:var(--parchment); border-radius:999px; padding:8px 16px; font:inherit; width:min(220px,100%);
  }

  /* Pannello collezione */
  #overview h2, .ovgame{
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:700; letter-spacing:-.01em;
    font-size:clamp(20px,3vw,28px); margin:6px 0 4px;
  }
  .ovgame{margin-top:22px; color:var(--gold); border-bottom:1px solid var(--line); padding-bottom:4px;}
  #ovTotal{color:var(--mute); font-size:13px; margin-bottom:8px;}
  .ovrow{
    display:grid; grid-template-columns:minmax(64px,150px) 1fr 100px; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .ovrow:hover .ovcode{color:var(--gold);}
  .ovcode{font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:700; font-size:16px; letter-spacing:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ovbar{height:10px; background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
  .ovbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--wax));}
  .ovnum{font-size:12px; color:var(--mute); text-align:right;}
  .ovempty{color:var(--mute); font-size:13px; padding:8px 0;}
  #ovActions{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px;}
  #listOut{
    width:100%; margin-top:14px; min-height:160px; background:var(--panel);
    border:1px solid var(--line); color:var(--parchment); border-radius:var(--radius-md);
    padding:12px; font-family:ui-monospace,monospace; font-size:12px; line-height:1.5;
  }

  /* Wishlist */
  .wishBtn{
    background:none; border:1px solid var(--line); border-radius:999px;
    width:26px; height:26px; cursor:pointer; font-size:13px; line-height:1;
    color:var(--mute); flex:0 0 auto; transition:border-color .15s, color .15s;
  }
  .wishBtn:hover{border-color:var(--gold);}
  .wishBtn.on{color:var(--wax); border-color:var(--wax); background:rgba(199,70,52,.14);}
  .card.wished{box-shadow:0 0 0 1px var(--wax) inset;}
  body.filter-wish .card:not(.wished){display:none;}

  /* Statistiche */
  #statsBody{max-width:640px;}
  .statBlock{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:16px 18px; margin-bottom:14px;
  }
  .statBlock h3{
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:700; letter-spacing:-.01em; color:var(--gold);
    font-size:19px; margin-bottom:8px;
  }
  .statNum{font-size:28px; font-weight:600; color:var(--parchment);}
  .statLbl{color:var(--mute); font-size:12px;}
  .statGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px;}
  .statBar{display:grid; grid-template-columns:110px 1fr 70px; gap:8px; align-items:center; padding:6px 0; font-size:13px;}
  .statBar .sbtrack{height:9px; background:var(--sea); border:1px solid var(--line); border-radius:5px; overflow:hidden;}
  .statBar .sbfill{height:100%; background:linear-gradient(90deg,var(--gold),var(--wax));}
  .toplist{list-style:none;}
  .toplist li{
    display:flex; justify-content:space-between; gap:10px; padding:7px 0;
    border-bottom:1px solid var(--line); font-size:13px;
  }
  .toplist .tval{color:var(--gold); font-weight:600; white-space:nowrap;}

  /* Zoom overlay */
  #zoom{
    position:fixed; inset:0; z-index:50; display:none;
    background:rgba(6,12,22,.88); align-items:center; justify-content:center; padding:24px;
    cursor:zoom-out;
  }
  #zoom.open{display:flex;}
  #zoom img{max-height:86vh; max-width:94vw; border-radius:var(--radius-lg); box-shadow:0 12px 50px rgba(0,0,0,.6);}
  #zoom figcaption{
    position:fixed; bottom:14px; left:0; right:0; text-align:center;
    font-size:14px; color:var(--parchment); letter-spacing:.5px;
  }
  #zoomLinks{display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  #zoomLinks a{
    background:var(--gold); color:#fff; text-decoration:none; font-weight:600;
    font-size:13px; padding:9px 16px; border-radius:999px;
  }
  #zoomLinks a.alt{background:var(--panel); color:var(--parchment); border:1px solid var(--line);}
  #zoomLinks a:hover{filter:brightness(1.1);}
  #zoomPrice{display:block; margin-top:8px; color:var(--gold); font-size:13px;}

  #status{color:var(--mute); font-size:13px; padding:8px 0;}

  /* Area utente e login */
  #authArea{display:flex; align-items:center; gap:8px; margin-left:auto;}
  #userMail{font-size:12px; color:var(--mute); max-width:180px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #authModal{
    position:fixed; inset:0; z-index:60; display:none;
    background:rgba(6,12,22,.88); align-items:center; justify-content:center; padding:24px;
  }
  #authModal.open{display:flex;}
  #authBox{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:26px; width:min(360px,100%); display:flex; flex-direction:column; gap:10px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #authBox h2{font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:700; letter-spacing:-.01em; color:var(--gold); font-size:24px;}
  #authBox input{
    background:var(--sea); border:1px solid var(--line); color:var(--parchment);
    border-radius:var(--radius-md); padding:11px 14px; font:inherit;
  }
  #authBox input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  #authBox .row{display:flex; gap:8px;}
  #authBox button{
    flex:1; background:var(--gold); color:#fff; border:none; border-radius:999px;
    padding:11px; font:inherit; font-weight:600; cursor:pointer;
  }
  #authBox button.alt{background:var(--sea); color:var(--parchment); border:1px solid var(--line);}
  #authMsg{font-size:12px; color:var(--mute); min-height:16px;}
  #syncDot{font-size:11px; color:var(--mute);}

  @media (prefers-reduced-motion: reduce){ .card{transition:none;} }
  @media (max-width:520px){ #grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));} }
</style>
</head>
<body>

<div id="errBar" role="alert" hidden><span id="errText"></span><button id="errClose" type="button">chiudi</button></div>

<header>
  <span id="logoMark">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <rect x="6" y="10" width="22" height="26" rx="4" transform="rotate(-10 17 23)" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.5"/>
      <rect x="10" y="7" width="22" height="26" rx="4" transform="rotate(6 21 20)" fill="var(--sea)" stroke="var(--line)" stroke-width="1.5"/>
      <rect x="12" y="9" width="18" height="22" rx="3.5" fill="var(--gold)"/>
      <circle cx="21" cy="20" r="4.5" fill="#fff" opacity=".92"/>
    </svg>
  </span>
  <h1 id="homeLink" title="Torna alla scelta del gioco">Collezionista Matto</h1>
  <button class="hbtn" id="btnOverview">&#128194; La mia collezione</button>
  <button class="hbtn hbtn-accent" id="btnScanGlobal" type="button">&#128247; Scansiona</button>
  <span id="authArea">
    <span id="userMail" hidden></span>
    <span id="syncDot" hidden></span>
    <button class="hbtn" id="btnAuth">Accedi</button>
  </span>
</header>

<div id="authModal" role="dialog" aria-modal="true" aria-label="Accesso">
  <div id="authBox">
    <h2>Accedi</h2>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="authPass" type="password" placeholder="Password (min 6 caratteri)" autocomplete="current-password">
    <div class="row">
      <button id="btnLogin" type="button">Accedi</button>
      <button id="btnSignup" type="button" class="alt">Registrati</button>
    </div>
    <button id="btnAuthClose" type="button" class="alt">Annulla</button>
    <p id="authMsg"></p>
  </div>
</div>

<main>
  <section id="home">
    <!-- riempita da renderHome() -->
  </section>

  <section id="setsView" hidden>
    <button class="backBtn" id="btnBackHome" type="button">&#8249; Giochi</button>
    <div id="langBar" class="langBar" hidden>
      <span class="langLbl">Lingua:</span>
      <button data-l="en" class="active" type="button">🇬🇧 Inglese</button>
      <button data-l="jp" type="button">🇯🇵 Giapponese</button>
    </div>
    <h2 id="setsTitle"></h2>
    <div id="ygoPicker">
      <input id="ygoSearch" type="search" placeholder="Cerca un set Yu-Gi-Oh! (es. Metal Raiders, LOB...)"
        aria-label="Cerca set Yu-Gi-Oh!">
    </div>
    <div id="setsGrid"></div>
  </section>

  <section id="setView" hidden>
    <button class="backBtn" id="btnBackSets" type="button">&#8249; Espansioni</button>
    <h2 id="setTitle"></h2>
    <p id="setCount"></p>
    <div id="langBarCards" class="langBar" hidden>
      <span class="langLbl">Lingua:</span>
      <button data-l="en" class="active" type="button">🇬🇧 Inglese</button>
      <button data-l="jp" type="button">🇯🇵 Giapponese</button>
    </div>
    <div id="toolbar" role="group" aria-label="Filtro possesso">
      <button data-f="all" class="active">Tutte</button>
      <button data-f="owned">Possedute</button>
      <button data-f="missing">Mancanti</button>
      <button data-f="dupes">Doppie (x2+)</button>
      <button data-f="wish">Desiderate</button>
      <button id="btnScan" type="button">&#128247; Scansiona carta</button>
      <input type="file" id="scanFile" accept="image/*" capture="environment" hidden>
      <span id="searchWrap"><input id="search" type="search"
        placeholder="Vai alla carta (es. OP05-119)" aria-label="Cerca carta One Piece per codice"></span>
    </div>
    <div id="grid"></div>
  </section>

  <section id="overview" hidden>
    <h2>La mia collezione</h2>
    <p id="ovTotal"></p>
    <div id="ovRows"></div>
    <div id="ovActions">
      <button id="btnExport">Esporta backup (JSON)</button>
      <button id="btnImport">Importa backup</button>
      <button id="btnStats" type="button">Statistiche</button>
      <button id="btnWishList" type="button">Copia lista desideri</button>
      <button id="btnDupeList" type="button">Copia lista doppioni</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <textarea id="listOut" hidden readonly></textarea>
  </section>

  <section id="statsView" hidden>
    <button class="backBtn" id="btnBackStats" type="button">&#8249; Collezione</button>
    <h2>Statistiche</h2>
    <div id="statsBody"></div>
  </section>

  <p id="status"></p>
</main>

<div id="zoom" role="dialog" aria-modal="true">
  <figure>
    <img id="zoomImg" src="" alt="">
    <figcaption>

function makeLangPred(langFilter){
  const lf = langFilter || (langAware() ? lang : "any");
  if (lf === "any") return () => true;
  if (lf === "jp") return isJpKey;
  return (id) => !isJpKey(id);            // "en"
}
function ownedCount(prefix, langFilter){
  const ok = makeLangPred(langFilter);
  let n = 0;
  for (const id in COLL) if (id.startsWith(prefix) && ok(id)) n++;
  return n;
}
function copiesCount(prefix, langFilter){
  const ok = makeLangPred(langFilter);
  let n = 0;
  for (const id in COLL) if (id.startsWith(prefix) && ok(id)) n += COLL[id];
  return n;
}
function setQty(key, delta, fig, out){

function makeTile(opt){
  // opt: {key, label, thumb, big, links[], price, extraClass, onImgError}
  const q0 = COLL[opt.key] || 0;
  const fig = document.createElement("figure");
  fig.className = "card" + (opt.extraClass ? " " + opt.extraClass : "") +
    (q0 >= 1 ? " owned" : "") + (q0 >= 2 ? " dupe" : "") + (isWished(opt.key) ? " wished" : "");
  fig.dataset.id = opt.dataId || opt.key;

  const img = document.createElement("img");
  img.loading = opt.eager ? "eager" : "lazy";
  img.alt = opt.label;
  img.src = opt.thumb;
  if (opt.onImgError) opt.onImgError(img, fig);

  const cap = document.createElement("figcaption");
  cap.className = "owncap";
  const lbl = document.createElement("span");
  lbl.className = "clabel";
  lbl.textContent = opt.label;
  lbl.title = opt.label;
  const step = document.createElement("span");
  step.className = "stepper";
  step.addEventListener("click", (e) => e.stopPropagation());
  const minus = document.createElement("button");
  minus.textContent = "\u2212";
  minus.setAttribute("aria-label", "Rimuovi una copia di " + opt.label);
  const qty = document.createElement("span");
  qty.className = "qty"; qty.textContent = q0;
  const plus = document.createElement("button");

  minus.addEventListener("click", () => setQty(opt.key, -1, fig, qty));
  plus.addEventListener("click", () => setQty(opt.key, 1, fig, qty));
  const wish = document.createElement("button");
  wish.className = "wishBtn" + (isWished(opt.key) ? " on" : "");

  wish.textContent = "\u2605";

  wish.setAttribute("aria-label", "Desidero " + opt.label);
  wish.addEventListener("click", () => {
    const on = toggleWish(opt.key);
    wish.classList.toggle("on", on);
    fig.classList.toggle("wished", on);
  });
  step.appendChild(minus); step.appendChild(qty); step.appendChild(plus); step.appendChild(wish);
  cap.appendChild(lbl); cap.appendChild(step);

  fig.appendChild(img); fig.appendChild(cap);
  fig.addEventListener("click", () => openZoom(opt.big || img.src, opt.label, opt.links, opt.price));
  return fig;
}

function chainImg(img, sources){
  let i = 0;
  const tryNext = () => {
    if (i >= sources.length) return;
    const s = sources[i++];
    if (typeof s === "function"){
      Promise.resolve(s()).then(u => { if (u) img.src = u; else tryNext(); }).catch(tryNext);
    } else {
      img.src = s;
    }
  };
  img.addEventListener("error", tryNext);
  tryNext();
}

// ---------- Copertine ufficiali dei booster (TCGplayer via TCGCSV) ----------
const coversPromise = {};
function coversFor(gameKey){
  if (!coversPromise[gameKey]) coversPromise[gameKey] = buildCovers(gameKey);
  return coversPromise[gameKey];
}
function tcgCover(gameKey, key){
  return coversFor(gameKey).then(m => m[key] || "").catch(() => "");
}
async function buildCovers(gameKey){
  const K = K_CACHE + "covers_v2_" + gameKey;
  const cached = loadJSON(K, null);
  // Usa la cache solo se NON vuota: cosi' un fallimento temporaneo non blocca
  // le copertine per giorni (era il bug che mostrava sempre le carte campione).
  if (cached && cached.d && Object.keys(cached.d).length && Date.now() - cached.t < 7 * 86400000) return cached.d;

  // 1) File JSON servito dalla stessa origine (generato da GitHub Actions): niente CORS.
  try{
    const res = await fetch((gameKey === "op" ? "covers-op.json" : "covers-lor.json") + "?v=" + Date.now());
    if (res.ok){
      const map = await res.json();
      if (map && Object.keys(map).length){
        saveJSON(K, {t: Date.now(), d: map});
        return map;
      }
    }
  }catch(e){ /* file assente: si prova TCGCSV diretto qui sotto */ }

  // 2) Ripiego: TCGCSV diretto. Funziona in locale/dev; su GitHub Pages sara'
  //    bloccato da CORS e la catena immagini passera' alla carta del set.
  const map = {};
  try{
    const cats = (await (await fetch("https://tcgcsv.com/tcgplayer/categories")).json()).results || [];
    const wanted = (gameKey === "op") ? "one piece" : "lorcana";
    const cat = cats.find(c => ((c.name || "") + " " + (c.displayName || "")).toLowerCase().includes(wanted));
    if (cat){
      const groups = (await (await fetch("https://tcgcsv.com/tcgplayer/" + cat.categoryId + "/groups")).json()).results || [];
      const targets = [];
      if (gameKey === "op"){
        OP_SETS.forEach(s => {
          const g = groups.find(g =>
            (g.abbreviation || "").toUpperCase().replace(/-/g, "") === s.c ||
            (g.name || "").toLowerCase().includes(s.n.toLowerCase()));
          if (g) targets.push({key: s.c, gid: g.groupId});
        });
      } else {
        (lorSets || []).forEach(s => {
          const g = groups.find(g => (g.name || "").toLowerCase().includes(s.n.toLowerCase()));
          if (g) targets.push({key: String(s.c), gid: g.groupId});
        });
      }
      await Promise.all(targets.map(async t => {
        try{
          const prods = (await (await fetch("https://tcgcsv.com/tcgplayer/" + cat.categoryId + "/" + t.gid + "/products")).json()).results || [];
          const p = prods.find(x => /booster box/i.test(x.name || "")) ||
                    prods.find(x => /booster/i.test(x.name || "")) ||
                    prods.find(x => x.imageUrl);
          if (p && p.imageUrl) map[t.key] = p.imageUrl.replace("_200w", "_in_1000x1000");
        }catch(e){ /* singolo set senza copertina: si prosegue */ }
      }));
    }
  }catch(e){ /* TCGCSV non raggiungibile dal browser: la catena passa alle fonti successive */ }
  if (Object.keys(map).length) saveJSON(K, {t: Date.now(), d: map});
  return map;
}

function pad3(n){ return String(n).padStart(3, "0"); }

function showOp(i, focusId){
  game = "op";
  opCurrent = i;
  const s = OP_SETS[i];
  $("searchWrap").style.display = "";
  showView("cards");
  refreshLangBars();
  const jp = lang === "jp";
  title.innerHTML = s.c + " \u00B7 " + s.n + (jp ? ' <span class="langTag">\ud83c\uddef\ud83c\uddf5 JP</span>' : "");
  grid.innerHTML = "";
  curPrefix = s.c + "-";
  ownedInSet = ownedCount(curPrefix);

  // Set non ancora uscito: niente sondaggio (fallirebbe su tutte le carte),
  // messaggio chiaro con la data invece di una griglia vuota poco chiara.
  if (s.release && new Date(s.release) > new Date()){
    const d = new Date(s.release).toLocaleDateString("it-IT", {day:"numeric", month:"long", year:"numeric"});
    countEl.textContent = "Non ancora uscito";
    statusEl.textContent = s.c + " \u00B7 " + s.n + " esce il " + d + ": le immagini non sono ancora disponibili da nessuna fonte.";
    opLoaded = 0; opProbed = 0; opProbeTotal = 0;
    return;
  }

  countEl.textContent = "Caricamento carte\u2026";
  opLoaded = 0; opProbed = 0; opProbeTotal = s.max;
  // Token di generazione: invalida i completamenti "in ritardo" di immagini
  // richieste da un set aperto in precedenza (altrimenti, navigando in fretta
  // tra i set, quei completamenti tardivi corrompono il conteggio del set attuale).
  const myGen = ++opGen;

  // Fonti immagini per lingua. JP: prima il sito Bandai JP, poi ripiego sull'EN
  // (il CDN Limitless ha soprattutto la variante _EN), cosi' non resta mai vuoto.
  const hostsFor = (id) => jp
    ? [ "https://www.onepiece-cardgame.com/images/cardlist/card/" + id + ".png",
        OP_HOSTS[0](s.c, id), OP_HOSTS[1](s.c, id) ]
    : [ OP_HOSTS[0](s.c, id), OP_HOSTS[1](s.c, id), OP_HOSTS[2](s.c, id) ];

  for (let n = 1; n <= s.max; n++){
    const id = s.c + "-" + pad3(n);
    const hosts = hostsFor(id);
    const tile = makeTile({
      key: keyWithLang(id), dataId: id, label: id,
      thumb: hosts[0],
      eager: true,  // il sondaggio deve completarsi subito: niente lazy-loading qui
      links: [
        {t:"Prezzi \u20AC su Cardmarket", u:"https://www.cardmarket.com/en/OnePiece/Products/Search?searchString=" + id},
        {t:"Scheda Limitless", u:"https://onepiece.limitlesstcg.com/cards/" + id, alt:true}
      ],
      onImgError: (img, fig) => {
        img.dataset.host = "0";
        img.addEventListener("error", () => {
          if (myGen !== opGen) return;  // il set e' cambiato: ignora questo completamento tardivo
          const h = Number(img.dataset.host) + 1;
          if (h < hosts.length){ img.dataset.host = String(h); img.src = hosts[h]; }
          else { fig.remove(); opProbeDone(); }
        });
        img.addEventListener("load", () => {
          if (myGen !== opGen) return;  // idem
          opLoaded++; opProbeDone();
        });
      }
    });
    grid.appendChild(tile);
  }

  if (focusId){
    setTimeout(() => {
      const el = grid.querySelector('[data-id="' + focusId + '"]');
      if (el){
        el.classList.add("hit");
        el.scrollIntoView({behavior:"smooth", block:"center"});
        setTimeout(() => el.classList.remove("hit"), 3500);
      }
    }, 400);
  }
}
function opProbeDone(){
  opProbed++;
  updateSetCount();
  if (opProbed >= opProbeTotal){
    if (opLoaded === 0){
      statusEl.textContent = "Nessuna immagine caricata: controlla la connessione internet e ricarica la pagina.";
    } else {
      const s = OP_SETS[opCurrent];
      // Non sovrascrivo un totale gia' verificato (op-set-totals.json): il
      // sondaggio live aggiorna TOTALS solo per i set che non lo hanno ancora.
      if (!opAuthoritative.has(s.c) && TOTALS[s.c] !== opLoaded){ TOTALS[s.c] = opLoaded; saveJSON(K_TOT, TOTALS); }
    }
  }
}

});

// ============================================================
// Cache API generica (localStorage, TTL 7 giorni)
// ============================================================
async function cachedFetch(cacheKey, url, extract){
  const k = K_CACHE + cacheKey;
  const hit = loadJSON(k, null);
  if (hit && Date.now() - hit.t < 7 * 86400000) return hit.d;
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = extract(await res.json());
  saveJSON(k, {t: Date.now(), d: data});
  return data;
}

// ============================================================
// SCANNER (OCR con Tesseract.js caricato al primo uso)
// ============================================================
let tessWorker = null;
async function getWorker(){
  if (tessWorker) return tessWorker;
  statusEl.textContent = "Carico il motore OCR (solo la prima volta)\u2026";
  if (!window.Tesseract){
    await new Promise((ok, ko) => {
      const sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      sc.onload = ok; sc.onerror = () => ko(new Error("CDN non raggiungibile"));
      document.head.appendChild(sc);
    });
  }
  tessWorker = await Tesseract.createWorker("eng");
  await tessWorker.setParameters({
    tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/ "
  });
  return tessWorker;
}
// Ricrea il motore da zero: usato dopo ogni scatto, cosi' un accumulo di
// memoria o di stato interno (piu' letture per foto, su un telefono con
// risorse limitate) non pregiudica la scansione successiva.
async function resetWorker(){
  if (tessWorker){
    try{ await tessWorker.terminate(); }catch(e){ /* ignora */ }
    tessWorker = null;
  }
}

// Pre-elaborazione: ridimensiona, scala di grigi, aumenta contrasto.
// Accetta sia <img> che ImageBitmap (drawImage funziona con entrambi),
// per questo le dimensioni sorgente vengono passate esplicitamente.
function preprocess(drawable, srcW, srcH){
  const maxDim = 1600;
  const scale = Math.min(1, maxDim / Math.max(srcW, srcH)) || 1;
  const cv = document.createElement("canvas");
  cv.width = Math.round(srcW * scale);
  cv.height = Math.round(srcH * scale);
  const ctx = cv.getContext("2d");
  ctx.drawImage(drawable, 0, 0, cv.width, cv.height);
  const d = ctx.getImageData(0, 0, cv.width, cv.height);
  const px = d.data;
  for (let i = 0; i < px.length; i += 4){
    let g = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
    g = (g - 128) * 1.6 + 128;                 // contrasto
    g = Math.max(0, Math.min(255, g));
    px[i] = px[i+1] = px[i+2] = g;
  }
  ctx.putImageData(d, 0, 0);
  return cv;
}

// Ritaglia una regione della foto (in frazioni 0-1 di larghezza/altezza) e la
// INGRANDISCE fino a targetW: utile per le fasce strette dove i produttori
// stampano il codice, che nella foto intera sono troppo piccole per l'OCR.
function preprocessRegion(drawable, srcW, srcH, fx, fy, fw, fh, targetW){
  const cropW = Math.round(srcW * fw), cropH = Math.round(srcH * fh);
  const sx = Math.round(srcW * fx), sy = Math.round(srcH * fy);
  const scale = Math.max(1, targetW / cropW);
  const cv = document.createElement("canvas");
  cv.width = Math.round(cropW * scale);
  cv.height = Math.round(cropH * scale);
  const ctx = cv.getContext("2d");
  ctx.drawImage(drawable, sx, sy, cropW, cropH, 0, 0, cv.width, cv.height);
  const d = ctx.getImageData(0, 0, cv.width, cv.height);
  const px = d.data;
  for (let i = 0; i < px.length; i += 4){
    let g = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
    g = (g - 128) * 1.6 + 128;
    g = Math.max(0, Math.min(255, g));
    px[i] = px[i+1] = px[i+2] = g;
  }
  ctx.putImageData(d, 0, 0);
  return cv;
}

$("btnScan").addEventListener("click", () => $("scanFile").click());
$("btnScanGlobal").addEventListener("click", () => $("scanFile").click());
$("scanFile").addEventListener("change", async () => {
  const f = $("scanFile").files[0];
  $("scanFile").value = "";
  if (!f) return;
  statusEl.textContent = "Elaboro la foto\u2026";
  let bitmap = null, url = null;
  try{
    // createImageBitmap gestisce meglio l'orientamento EXIF (foto verticali da
    // smartphone) e la decodifica dei formati fotocamera rispetto a un <img>
    // semplice; dove non e' supportato, si ripiega su <img> come prima.
    if (window.createImageBitmap){
      try{ bitmap = await createImageBitmap(f, { imageOrientation: "from-image" }); }
      catch(e){ /* alcuni browser/formati non sono supportati: si ripiega su <img> sotto */ }
    }
    let drawable, srcW, srcH;
    if (bitmap){
      drawable = bitmap; srcW = bitmap.width; srcH = bitmap.height;
    } else {
      url = URL.createObjectURL(f);
      const imgEl = new Image();
      await new Promise((ok, ko) => { imgEl.onload = ok; imgEl.onerror = ko; imgEl.src = url; });
      drawable = imgEl; srcW = imgEl.naturalWidth; srcH = imgEl.naturalHeight;
    }
    const worker = await getWorker();

    // Il codice e' quasi sempre stampato in una fascia stretta sul bordo della
    // carta: provo alcuni ritagli mirati (molto piu' efficaci che leggere la
    // foto intera, dove il codice e' piccolo in mezzo all'illustrazione) prima
    // di ripiegare sulla foto intera come ultima spiaggia.
    const regions = [
      {fx:0.00, fy:0.84, fw:0.55, fh:0.14},  // basso-sinistra (One Piece, Lorcana)
      {fx:0.45, fy:0.84, fw:0.55, fh:0.14},  // basso-destra
      {fx:0.00, fy:0.86, fw:1.00, fh:0.12},  // striscia intera in basso (Yu-Gi-Oh!, righe lunghe)
    ];
    let m = null;
    for (const r of regions){
      statusEl.textContent = "Leggo il codice sulla carta\u2026";
      await worker.setParameters({ tessedit_pageseg_mode: "7" });  // riga singola
      const cv = preprocessRegion(drawable, srcW, srcH, r.fx, r.fy, r.fw, r.fh, 900);
      const {data} = await worker.recognize(cv);
      m = matchCard((data.text || "").toUpperCase());
      if (m) break;
    }
    if (!m){
      statusEl.textContent = "Provo sull'intera foto\u2026";
      await worker.setParameters({ tessedit_pageseg_mode: "11" });  // testo sparso
      const {data} = await worker.recognize(preprocess(drawable, srcW, srcH));
      m = matchCard((data.text || "").toUpperCase());
    }

    if (m){
      await applyCardMatch(m);
    } else {
      statusEl.textContent = "Nessun codice riconosciuto. Fotografa da vicino e con buona luce: " +
        "One Piece \u2192 codice in basso a sinistra (OP05-119); Yu-Gi-Oh! \u2192 codice sotto l'illustrazione " +
        "(MRD-EN060); Lorcana \u2192 tutta la riga in basso a sinistra (12/204 EN 3); LEGO \u2192 il numero " +
        "di set sulla scatola o sul libretto istruzioni (es. 75192).";
    }
  }catch(e){
    statusEl.textContent = "Scansione non riuscita: " + (e.message || e) + ". Serve connessione per il motore OCR.";
  }finally{
    if (bitmap && bitmap.close) bitmap.close();
    if (url) URL.revokeObjectURL(url);
    await resetWorker();  // motore pulito per il prossimo scatto, riuscito o no
  }
});

function bumpKey(key){
  COLL[key] = (COLL[key] || 0) + 1;
  saveJSON(K_COLL, COLL);
  cloudSetQty(key, COLL[key]);
  return COLL[key];
}

// --- Rilevamento PURO (nessun effetto): torna {type, canon, ...} o null ---
function matchCard(rawText){
  const clean = (rawText || "").toUpperCase().replace(/[\u2013\u2014]/g, "-");

  const mOp = clean.match(/\b(OP|EB|PRB)\s?(\d{2})\s?-\s?(\d{3})\b/);
  if (mOp){
    const setCode = mOp[1] + mOp[2];
    const id = setCode + "-" + mOp[3];
    return {type: "op", canon: "op:" + id, setCode, id};
  }

  const mLor = clean.match(/\b(\d{1,3})\s*\/\s*(\d{2,3})\b/);
  if (mLor){
    const num = String(Number(mLor[1]));
    let setCode = null;
    const after = clean.slice(mLor.index + mLor[0].length);
    const mSet = after.match(/^[^0-9]{0,16}(\d{1,2})\b/);
    if (mSet) setCode = String(Number(mSet[1]));
    else if (curPrefix.startsWith("lor:")) setCode = curPrefix.split(":")[1];
    return {type: "lor", canon: "lor:" + (setCode || "?") + ":" + num, num, setCode, total: mLor[2]};
  }

  const mYgo = clean.match(/\b([A-Z]{2,5})-([A-Z]{0,2})(\d{3})\b/);
  if (mYgo){
    const region = mYgo[2];
    const detected = (region === "JP" || region === "JA") ? "jp" : "en";
    const printed = mYgo[1] + "-" + region + mYgo[3];
    return {type: "ygo", canon: "ygo:" + printed, setPrefix: mYgo[1], region, detected, printed};
  }

  // LEGO: numero di set nudo (4-6 cifre, es. 75192, a volte con suffisso -1).
  // Controllato per ultimo perche' meno specifico (nessuna lettera che lo ancori):
  // il match viene poi verificato contro il catalogo reale prima di essere accettato.
  const mLego = clean.match(/\b(\d{4,6})(?:-\d{1,2})?\b/);
  if (mLego){
    return {type: "lego", canon: "lego:" + mLego[1], code: mLego[1]};
  }
  return null;
}

// --- Azione a partire da un match (effetti: aggiunge, redirige, aggiorna status) ---
async function applyCardMatch(m){
  if (m.type === "op"){
    const idx = OP_SETS.findIndex(s => s.c === m.setCode);
    if (idx < 0){ statusEl.textContent = "Codice letto (" + m.id + ") ma il set non \u00E8 in elenco."; return; }
    const q = bumpKey(keyLangFor("op", m.id));
    statusEl.textContent = "\u2713 " + m.id + langLabel() + " aggiunta alla collezione (ora x" + q + ")";
    showOp(idx, m.id);
    return;
  }
  if (m.type === "lor"){
    let setCode = m.setCode;
    if (!setCode){
      statusEl.textContent = "Letto il numero " + m.num + "/" + m.total +
        " ma non il set: apri prima il set Lorcana giusto, oppure includi tutta la riga in basso nella foto.";
      return;
    }
    if (!lorSets){
      try{ lorSets = await cachedFetch("lorsets", LOR_SETS_URL, (j) => (j.results || []).map(s => ({c: s.code, n: s.name}))); }
      catch(e){ /* si prosegue comunque */ }
    }
    const known = lorSets && lorSets.find(s => String(s.c) === setCode);
    const q = bumpKey("lor:" + setCode + ":" + m.num);
    statusEl.textContent = "\u2713 Lorcana " + m.num + " del set " + (known ? known.n : setCode) + " aggiunta (ora x" + q + ")";
    return;
  }
  if (m.type === "ygo"){
    const langTxt = m.detected === "jp" ? "giapponese \ud83c\uddef\ud83c\uddf5" : "inglese \ud83c\uddec\ud83c\udde7";
    statusEl.textContent = "Codice letto: " + m.printed + " (" + langTxt + ") \u00B7 cerco la carta\u2026";
    try{
      const res = await fetch("https://db.ygoprodeck.com/api/v7/cardsetsinfo.php?setcode=" + encodeURIComponent(m.printed));
      if (!res.ok) throw new Error("carta non trovata");
      const info = await res.json();
      if (!info || !info.id) throw new Error("carta non trovata");
      const suffix = m.detected === "jp" ? "~jp" : "";
      const q = bumpKey("ygo:" + m.setPrefix + ":" + info.id + suffix);
      TOTALS["ygoname:" + m.setPrefix] = TOTALS["ygoname:" + m.setPrefix] || info.set_name || m.setPrefix;
      saveJSON(K_TOT, TOTALS);
      statusEl.textContent = "\u2713 " + (info.name || m.printed) + " [" + m.printed + "] " +
        (m.detected === "jp" ? "[JP]" : "[EN]") + " aggiunta (ora x" + q + ")";
    }catch(e){
      statusEl.textContent = m.detected === "jp"
        ? "Rilevata carta giapponese (" + m.printed + "), ma il database gratuito \u00E8 solo inglese e non risolve i codici set JP. Aprila dal set inglese in modalit\u00E0 \ud83c\uddef\ud83c\uddf5 e segna col +."
        : "Codice letto (" + m.printed + ") ma la carta non risulta nel database.";
    }
    return;
  }
  if (m.type === "lego"){
    statusEl.textContent = "Codice letto: " + m.code + " \u00B7 cerco nel catalogo LEGO\u2026";
    const found = await findLegoSet(m.code);
    if (!found){
      statusEl.textContent = "Codice " + m.code + " non trovato nel catalogo LEGO: potrebbe non essere un numero di " +
        "set (es. prezzo o et\u00E0 consigliata letti per errore), oppure rientrare in una categoria esclusa dal catalogo.";
      return;
    }
    const key = "lego:" + found.cat.id + ":" + found.entry.n;
    const q = bumpKey(key);
    statusEl.textContent = "\u2713 " + found.entry.t + " [" + found.entry.n + "] aggiunto alla collezione (ora x" + q + ")";
    showLegoCat(found.catIdx, key);
    return;
  }
}

async function handleScannedText(text){
  const m = matchCard(text);
  if (m){ await applyCardMatch(m); return; }
  statusEl.textContent = "Nessun codice riconosciuto. Fotografa da vicino e con buona luce: " +
    "One Piece \u2192 codice in basso a sinistra (OP05-119); Yu-Gi-Oh! \u2192 codice sotto l'illustrazione " +
    "(MRD-EN060); Lorcana \u2192 tutta la riga in basso a sinistra (12/204 EN 3); LEGO \u2192 il numero di set " +
    "sulla scatola o sul libretto istruzioni (es. 75192), inquadrando da vicino solo quel numero.";
}

function ovRow(rows, label, prefix, tot, onClick, langFilter){
  const own = ownedCount(prefix, langFilter);
  const pct = tot ? Math.min(100, Math.round(own / tot * 100)) : 0;
  const row = document.createElement("div");
  row.className = "ovrow";
  row.innerHTML =
    '<span class="ovcode" title="' + label + '">' + label + '</span>' +
    '<span class="ovbar"><i style="width:' + pct + '%"></i></span>' +
    '<span class="ovnum">' + own + ' / ' + (tot || "?") + (tot ? " \u00B7 " + pct + "%" : "") + '</span>';
  if (onClick) row.addEventListener("click", onClick);
  rows.appendChild(row);
  return own;
}
function ovHeader(rows, text){
  const h = document.createElement("div"); h.className = "ovgame"; h.textContent = text; rows.appendChild(h);
}
function hasLangCards(prefix, lf){ return ownedCount(prefix, lf) > 0; }

// ---------- Etichetta leggibile a partire da una chiave carta ----------
function labelForKey(id){
  const jp = isJpKey(id) ? " [JP]" : "";
  const base = id.replace(/~jp$/, "");
  if (base.startsWith("ygo:")){
    const [, code, passcode] = base.split(":");
    return (TOTALS["ygoname:" + code] || code) + " \u2014 carta #" + passcode + jp;
  }
  if (base.startsWith("lor:")){
    const [, code, num] = base.split(":");
    return (TOTALS["lorname:" + code] || ("Set " + code)) + " \u2014 n." + num;
  }
  if (base.startsWith("mtg:")){
    const [, code, num] = base.split(":");
    return (TOTALS["mtgname:" + code] || code.toUpperCase()) + " \u2014 n." + num;
  }
  if (base.startsWith("lego:")){
    const [, catId, setNum] = base.split(":");
    return (TOTALS["legoname:" + catId] || ("Categoria " + catId)) + " \u2014 set " + setNum;
  }
  return base + jp;  // One Piece: gia' leggibile cosi' com'e' (es. OP05-119)
}

  if (navigator.clipboard && navigator.clipboard.writeText){

    }).catch(() => { statusEl.textContent = "Lista pronta qui sotto: selezionala e copiala manualmente."; });

  }
}

function renderOverview(){
  showView("overview");
  const rows = $("ovRows");
  rows.innerHTML = "";
  let grandOwned = 0, grandCopies = 0;
  for (const id in COLL) grandCopies += COLL[id];

  // --- One Piece: sezione EN sempre, JP solo se ha carte ---
  const opEnabled = [["en", "Inglese \ud83c\uddec\ud83c\udde7"], ["jp", "Giapponese \ud83c\uddef\ud83c\uddf5"]];
  opEnabled.forEach(([lf, lbl], idx) => {
    const anyOp = OP_SETS.some(s => hasLangCards(s.c + "-", lf));
    if (lf === "jp" && !anyOp) return;             // niente sezione JP vuota
    ovHeader(rows, "One Piece \u2013 " + lbl);
    OP_SETS.forEach((s, i) => {
      grandOwned += ovRow(rows, s.c, s.c + "-", TOTALS[s.c],
        () => { lang = lf; localStorage.setItem("tcg_lang", lf); showOp(i); }, lf);
    });
  });

  // --- Yu-Gi-Oh!: per lingua, solo set con carte in quella lingua ---
  ["en", "jp"].forEach(lf => {
    const codes = new Set();
    for (const id in COLL){
      if (!id.startsWith("ygo:")) continue;
      const jp = isJpKey(id);
      if ((lf === "jp") !== jp) continue;
      codes.add(id.split(":")[1]);
    }
    if (codes.size === 0) return;
    ovHeader(rows, "Yu-Gi-Oh! \u2013 " + (lf === "jp" ? "Giapponese \ud83c\uddef\ud83c\uddf5" : "Inglese \ud83c\uddec\ud83c\udde7"));
    [...codes].sort().forEach(code => {
      const label = TOTALS["ygoname:" + code] || code;
      grandOwned += ovRow(rows, label, "ygo:" + code + ":", TOTALS["ygo:" + code],
        () => { lang = lf; localStorage.setItem("tcg_lang", lf); enterGame("ygo"); }, lf);
    });
  });

  // --- Lorcana (solo inglese) ---
  const lorCodes = new Set();
  for (const id in COLL) if (id.startsWith("lor:")) lorCodes.add(id.split(":")[1]);
  for (const k in TOTALS) if (k.startsWith("lor:")) lorCodes.add(k.slice(4));
  ovHeader(rows, "Lorcana");
  if (lorCodes.size === 0){
    const p = document.createElement("p"); p.className = "ovempty";
    p.textContent = "Nessuna carta ancora: apri Lorcana dalla home per iniziare.";
    rows.appendChild(p);
  } else {
    [...lorCodes].sort((a, b) => String(a).localeCompare(String(b), undefined, {numeric:true})).forEach(code => {
      const label = TOTALS["lorname:" + code] || ("Set " + code);
      grandOwned += ovRow(rows, label, "lor:" + code + ":", TOTALS["lor:" + code], () => openLorByCode(code), "any");
    });
  }

  // --- Magic (solo set con carte possedute) ---
  const mtgCodes = new Set();
  for (const id in COLL) if (id.startsWith("mtg:")) mtgCodes.add(id.split(":")[1]);
  if (mtgCodes.size){
    ovHeader(rows, "Magic");
    [...mtgCodes].sort().forEach(code => {
      const label = TOTALS["mtgname:" + code] || code.toUpperCase();
      grandOwned += ovRow(rows, label, "mtg:" + code + ":", TOTALS["mtg:" + code], () => openMtgByCode(code), "any");
    });
  }

  // --- LEGO (solo categorie con set posseduti) ---
  const legoCodes = new Set();
  for (const id in COLL) if (id.startsWith("lego:")) legoCodes.add(id.split(":")[1]);
  if (legoCodes.size){
    ovHeader(rows, "LEGO");
    [...legoCodes].sort().forEach(code => {
      const label = TOTALS["legoname:" + code] || ("Categoria " + code);
      grandOwned += ovRow(rows, label, "lego:" + code + ":", TOTALS["lego:" + code], () => openLegoByCat(code), "any");
    });
  }

  $("ovTotal").textContent = "Totale complessivo: " + grandOwned + " carte uniche" +
    (grandCopies > grandOwned ? " (" + grandCopies + " copie)" : "");
}
async function openLorByCode(code){
  game = "lor";
  if (!lorSets){ await renderLorSets(); }
  const i = lorSets ? lorSets.findIndex(s => String(s.c) === String(code)) : -1;
  if (i >= 0) showLorSet(i); else enterGame("lor");
}

// Scryfall pagina le carte (175 per pagina): seguo next_page fino a 4 pagine.
async function fetchMtgCards(code){
  const K = K_CACHE + "mtg_" + code;
  const hit = loadJSON(K, null);
  if (hit && hit.d && hit.d.length && Date.now() - hit.t < 7 * 86400000) return hit.d;
  let url = MTG_CARDS_URL(code);
  const out = [];
  for (let page = 0; page < 4 && url; page++){
    const res = await fetch(url, {headers: {"Accept": "application/json"}});
    if (!res.ok) break;
    const j = await res.json();
    (j.data || []).forEach(c => {
      const iu = c.image_uris || (c.card_faces && c.card_faces[0] && c.card_faces[0].image_uris);
      out.push({
        num: c.collector_number,
        n: c.name,
        s: iu ? iu.small : "",
        b: iu ? (iu.normal || iu.large) : "",
        p: c.prices && c.prices.eur ? c.prices.eur : ""
      });
    });
    url = j.has_more ? j.next_page : null;
    if (url) await new Promise(r => setTimeout(r, 120));  // gentile col rate limit Scryfall
  }
  out.sort((a, b) => String(a.num).localeCompare(String(b.num), undefined, {numeric:true}));
  if (out.length) saveJSON(K, {t: Date.now(), d: out});
  return out;
}

async function showMtgSet(i){
  const s = mtgSets[i];
  game = "mtg";
  $("searchWrap").style.display = "none";
  showView("cards");
  refreshLangBars();
  title.textContent = s.n + " (" + s.c.toUpperCase() + ")";
  countEl.textContent = "Caricamento carte\u2026";
  grid.innerHTML = "";
  curPrefix = "mtg:" + s.c + ":";
  ownedInSet = ownedCount(curPrefix, "any");
  let cards;
  try{ cards = await fetchMtgCards(s.c); }
  catch(e){ countEl.textContent = ""; statusEl.textContent = "Errore nel caricare il set: riprova tra qualche secondo."; return; }
  TOTALS["mtg:" + s.c] = cards.length;

}

async function fetchLegoSets(catId){
  const K = K_CACHE + "lego_" + catId;
  const hit = loadJSON(K, null);
  if (hit && hit.d && hit.d.length && Date.now() - hit.t < 7 * 86400000) return hit.d;
  const res = await fetch(LEGO_SETS_URL(catId));
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (Array.isArray(data) && data.length) saveJSON(K, {t: Date.now(), d: data});
  return data;
}

// Cerca un set LEGO per codice in tutte le categorie del catalogo (con cache
// locale per categoria gia' visitata). Usata sia dalla ricerca manuale sia
// dallo scanner, cosi' un codice fotografato viene sempre verificato contro
// il catalogo reale prima di essere accettato.
async function findLegoSet(code){
  if (!legoCats){ try{ await renderLegoCats(); }catch(e){} }
  if (!legoCats || !legoCats.length) return null;
  const norm = code.replace(/-\d+$/, "");
  for (let i = 0; i < legoCats.length; i++){
    let sets;
    try{ sets = await fetchLegoSets(legoCats[i].id); }catch(e){ continue; }
    const hit = sets.find(s => s.n === code || s.n === norm || s.n.replace(/-\d+$/, "") === norm);
    if (hit) return {catIdx: i, cat: legoCats[i], entry: hit};
  }
  return null;
}
async function searchLegoByCode(raw){
  const code = raw.trim();
  if (!code){ return; }
  statusEl.textContent = "Cerco il set " + code + "\u2026";
  const found = await findLegoSet(code);
  if (!found){
    if (!legoCats || !legoCats.length){
      statusEl.textContent = "Catalogo LEGO non disponibile: vedi GUIDA-INSTALLAZIONE.md per attivarlo.";
    } else {
      statusEl.textContent = "Set " + code + " non trovato (potrebbe essere in una categoria esclusa dal catalogo, es. bomboniere o parti sfuse).";
    }
    return;
  }
  showLegoCat(found.catIdx, "lego:" + found.cat.id + ":" + found.entry.n);
}
async function openLegoByCat(catId){
  game = "lego";
  if (!legoCats){ await renderLegoCats(); }
  const i = legoCats ? legoCats.findIndex(c => String(c.id) === String(catId)) : -1;
  if (i >= 0) showLegoCat(i); else enterGame("lego");
}

// Aggrega owned/totale per un set di prefissi "gioco:codice:" gia' visti
function aggregateGamePrefixes(gamePrefix){
  const codes = new Set();
  for (const id in COLL) if (id.startsWith(gamePrefix)) codes.add(id.split(":")[1]);
  for (const k in TOTALS) if (k.startsWith(gamePrefix) && !k.includes("name:")) codes.add(k.split(":")[1]);
  let owned = 0, total = 0;
  codes.forEach(code => {
    owned += ownedCount(gamePrefix + code + ":", "any");
    total += TOTALS[gamePrefix + code] || 0;
  });
  return {owned, total};
}

// Stima il valore in EUR leggendo i prezzi gia' salvati in cache (Yu-Gi-Oh! e
// Magic sono gli unici due giochi con prezzo per carta). E' una stima parziale:
// copre solo i set che sono gia' stati aperti almeno una volta nell'app.
function computeApproxValue(){
  let total = 0;
  const top = [];
  const scanCache = (prefix, cacheKeyOf, matchField) => {
    for (const id in COLL){
      if (!id.startsWith(prefix)) continue;
      const base = id.replace(/~jp$/, "");
      const parts = base.split(":");
      const code = parts[1], cardId = parts[2];
      const hit = loadJSON(K_CACHE + cacheKeyOf(code), null);
      if (!hit || !hit.d) continue;
      const card = hit.d.find(c => String(c[matchField]) === String(cardId));
      const price = card && card.p ? parseFloat(String(card.p).replace(",", ".")) : NaN;
      if (!isNaN(price)){
        const qty = COLL[id] || 1;
        total += price * qty;
        top.push({label: labelForKey(id), value: price * qty});
      }
    }
  };
  scanCache("ygo:", (code) => "ygo_" + code, "id");
  scanCache("mtg:", (code) => "mtg_" + code, "num");
  top.sort((a, b) => b.value - a.value);
  return {total, top: top.slice(0, 5)};
}

// Pezzi LEGO totali posseduti (stima dalle categorie gia' aperte)
function computeLegoPieces(){
  let pieces = 0, sets = 0;
  for (const id in COLL){
    if (!id.startsWith("lego:")) continue;
    const [, catId, setNum] = id.split(":");
    const hit = loadJSON(K_CACHE + "lego_" + catId, null);
    if (!hit || !hit.d) continue;
    const s = hit.d.find(x => String(x.n) === String(setNum));
    if (s){ pieces += (s.p || 0) * (COLL[id] || 1); sets += COLL[id] || 1; }
  }
  return {pieces, sets};
}

function statBar(rows, label, owned, total){
  const pct = total ? Math.min(100, Math.round(owned / total * 100)) : 0;
  const el = document.createElement("div");
  el.className = "statBar";
  el.innerHTML =
    '<span>' + label + '</span>' +
    '<span class="sbtrack"><span class="sbfill" style="width:' + pct + '%"></span></span>' +
    '<span>' + owned + (total ? " / " + total : "") + '</span>';
  rows.appendChild(el);
}

function renderStats(){
  showView("stats");
  const body = $("statsBody");
  body.innerHTML = "";

  let grandOwned = 0, grandCopies = 0;
  for (const id in COLL) grandCopies += COLL[id];
  grandOwned = Object.keys(COLL).length;

  // --- Totali generali ---
  const b1 = document.createElement("div");
  b1.className = "statBlock";
  b1.innerHTML =
    '<h3>Totali</h3><div class="statGrid">' +
    '<div><div class="statNum">' + grandOwned + '</div><div class="statLbl">carte/set unici</div></div>' +
    '<div><div class="statNum">' + grandCopies + '</div><div class="statLbl">copie totali</div></div>' +
    '<div><div class="statNum">' + Object.keys(WISH).length + '</div><div class="statLbl">nella wishlist</div></div>' +
    '</div>';
  body.appendChild(b1);

  // --- Completamento per gioco ---
  const b2 = document.createElement("div");
  b2.className = "statBlock";
  b2.innerHTML = '<h3>Completamento per gioco</h3>';
  const rows2 = document.createElement("div");
  let opO = 0, opT = 0;
  OP_SETS.forEach(s => { opO += ownedCount(s.c + "-", "any"); opT += TOTALS[s.c] || 0; });
  statBar(rows2, "One Piece", opO, opT);
  const ygoAgg = aggregateGamePrefixes("ygo:"); statBar(rows2, "Yu-Gi-Oh!", ygoAgg.owned, ygoAgg.total);
  const lorAgg = aggregateGamePrefixes("lor:"); statBar(rows2, "Lorcana", lorAgg.owned, lorAgg.total);
  const mtgAgg = aggregateGamePrefixes("mtg:"); statBar(rows2, "Magic", mtgAgg.owned, mtgAgg.total);
  const legoAgg = aggregateGamePrefixes("lego:"); statBar(rows2, "LEGO", legoAgg.owned, legoAgg.total);
  b2.appendChild(rows2);
  body.appendChild(b2);

  // --- Valore stimato (solo Yu-Gi-Oh! e Magic, set gia' visitati) ---
  const val = computeApproxValue();
  const b3 = document.createElement("div");
  b3.className = "statBlock";
  b3.innerHTML = '<h3>Valore stimato</h3>' +
    '<div class="statNum">\u2248 ' + val.total.toFixed(2) + ' \u20AC</div>' +
    '<div class="statLbl">Solo Yu-Gi-Oh! e Magic, e solo per i set gi\u00E0 aperti nell\'app ' +
    '(i prezzi restano in cache 7 giorni). Non \u00E8 una stima completa della collezione.</div>';
  if (val.top.length){
    const ul = document.createElement("ul");
    ul.className = "toplist";
    val.top.forEach(t => {
      const li = document.createElement("li");
      li.innerHTML = '<span>' + t.label + '</span><span class="tval">' + t.value.toFixed(2) + ' \u20AC</span>';
      ul.appendChild(li);
    });
    b3.appendChild(ul);
  }
  body.appendChild(b3);

  // --- Pezzi LEGO (bonus, solo se ha carte LEGO) ---
  const lp = computeLegoPieces();
  if (lp.sets > 0){
    const b4 = document.createElement("div");
    b4.className = "statBlock";
    b4.innerHTML = '<h3>LEGO</h3><div class="statGrid">' +
      '<div><div class="statNum">' + lp.sets + '</div><div class="statLbl">set posseduti</div></div>' +
      '<div><div class="statNum">' + lp.pieces.toLocaleString("it-IT") + '</div><div class="statLbl">pezzi totali (stima)</div></div>' +
      '</div>';
    body.appendChild(b4);
  }
}

importFile.addEventListener("change", () => {
  const f = importFile.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      COLL = data.collection || {};
      TOTALS = Object.assign(TOTALS, data.totals || {});
      WISH = data.wishlist || {};
      saveJSON(K_COLL, COLL); saveJSON(K_TOT, TOTALS); saveJSON(K_WISH, WISH);
      if (sb && user) pushAllToCloud();
      renderOverview();
      statusEl.textContent = "Backup importato correttamente.";
    }catch(e){ statusEl.textContent = "File di backup non valido."; }
  };
  r.readAsText(f);
  importFile.value = "";
});

// ============================================================
// ROUTER (History API): ogni vista e' una "pagina" con URL e
// supporto ai tasti Indietro/Avanti del browser.
// ============================================================
function applySet(g, s){
  if (g === "op") showOp(s.i);
  else if (g === "lor") showLorSet(s.i);
  else if (g === "mtg") showMtgSet(s.i);
  else if (g === "lego") showLegoCat(s.i, s.focus);
  else if (g === "ygo" && s.set) showYgoSet(s.set);
  else enterGame(g);
}
function navHome(){ history.pushState({v:"home"}, "", "#"); renderHome(); }
function navGame(g){ history.pushState({v:"game", g:g}, "", "#/" + g); enterGame(g); }
function navOverview(){ history.pushState({v:"overview"}, "", "#/collezione"); renderOverview(); }
function navStats(){ history.pushState({v:"stats"}, "", "#/statistiche"); renderStats(); }
function navSet(g, payload){
  const st = Object.assign({v:"set", g:g}, payload);
  history.pushState(st, "", "#/" + g + "/set");
  applySet(g, st);
}
window.addEventListener("popstate", (e) => {
  const s = e.state;
  if (!s || s.v === "home"){ renderHome(); return; }
  if (s.v === "game"){ enterGame(s.g); return; }
  if (s.v === "overview"){ renderOverview(); return; }
  if (s.v === "stats"){ renderStats(); return; }
  if (s.v === "set"){ applySet(s.g, s); return; }
  renderHome();
});

// Conteggi ufficiali dei set One Piece, pre-calcolati (vedi scripts/build-op-totals.py
// e il workflow "Aggiorna conteggi set One Piece"). Sopperiscono al sondaggio live,
// cosi' i numeri sono corretti anche nella griglia delle espansioni, prima ancora
// di aver aperto un singolo set.
async function loadOpTotals(){
  const K = K_CACHE + "op_totals_file";
  const hit = loadJSON(K, null);
  let data = (hit && hit.d && Date.now() - hit.t < 86400000) ? hit.d : null;
  if (!data){
    try{
      const res = await fetch("op-set-totals.json?v=" + Date.now());
      if (res.ok){
        data = await res.json();
        if (data && Object.keys(data).length) saveJSON(K, {t: Date.now(), d: data});
      }
    }catch(e){ /* file assente o nessuna connessione: si continua col sondaggio live */ }
  }
  if (data){
    let changed = false;
    for (const code in data){
      opAuthoritative.add(code);
      if (TOTALS[code] !== data[code]){ TOTALS[code] = data[code]; changed = true; }
    }
    if (changed){
      saveJSON(K_TOT, TOTALS);
      if (game === "op" && !$("setsView").hidden) renderOpSets();
    }
  }
}
loadOpTotals();

// ---------- Avvio (con deep-link dall'URL) ----------
(function initRoute(){
  const h = (location.hash || "").replace(/^#\/?/, "");
  const g = h.split("/")[0];
  if (["op", "ygo", "lor", "mtg", "lego"].includes(g)){
    history.replaceState({v:"game", g:g}, "", "#/" + g);
    enterGame(g);
  } else if (g === "collezione"){
    history.replaceState({v:"overview"}, "", "#/collezione");
    renderOverview();
  } else if (g === "statistiche"){
    history.replaceState({v:"stats"}, "", "#/statistiche");
    renderStats();
  } else {
    history.replaceState({v:"home"}, "", "#");
    renderHome();
  }
})();
